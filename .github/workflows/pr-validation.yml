name: PR validation

'on':
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-validation:
    name: Windows tests, lint, docs and source audit
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install locked test dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps .
      - name: Lint
        run: python -m ruff check localagentbridge scripts tests
      - name: Documentation and generated CLI reference
        run: python scripts/check_docs.py
      - name: Public source and ignore audit
        run: python scripts/prepare_release.py --check-ignore
      - name: Regression tests with mocked providers
        run: python -m pytest -q
