[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "localagentbridge"
version = "0.5.0.dev0"
description = "Small local Ollama MCP bridge and Windows usage monitor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=1.20,<2", "httpx>=0.28,<1", "opentelemetry-proto>=1.30,<2", "pathspec>=0.12,<2", "psutil>=7,<8", "pywin32>=311; sys_platform == 'win32'"]

[project.optional-dependencies]
tray = ["pystray>=0.19,<1", "Pillow>=11,<13"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
localagentbridge = "localagentbridge.__main__:main"

[project.urls]
Repository = "https://github.com/nishdel/LocalAgentBridge"
Issues = "https://github.com/nishdel/LocalAgentBridge/issues"
Security = "https://github.com/nishdel/LocalAgentBridge/security/policy"

[project.gui-scripts]
localagentbridge-tray = "localagentbridge.widget:main"

[tool.setuptools.packages.find]
include = ["localagentbridge*"]

[tool.setuptools.package-data]
localagentbridge = ["definitions/*/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data", "benchmarks", "release-staging", ".*test*"]

[tool.ruff.lint]
# Catch errors without a noisy reformat of the preserved v0.1 implementation.
select = ["E9", "F63", "F7", "F82"]
